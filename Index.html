<style>
  body{ background:#EFECE3; }
  .app{
    display:grid;
    grid-template-columns:1fr;
    max-width:1400px;
    margin:0 auto;
  }
  @media (min-width:1100px){
    .app{ grid-template-columns:480px 1fr; align-items:start; }
  }
  .panel{ background:#fff; }
  .form-panel{
    padding:0 0 60px;
    border-right:1px solid #ddd7c6;
    min-height:100vh;
  }
  .topbar{
    background:var(--navy1);
    color:#fff;
    padding:16px 22px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar img{ height:26px; }
  .topbar h1{ font-size:15px; margin:0; font-weight:700; letter-spacing:0.02em; }
  .form-body{ padding:18px 22px 10px; }
  details.section{
    border:1px solid #E3DFD2;
    border-radius:6px;
    margin-bottom:12px;
    overflow:hidden;
  }
  details.section > summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    background:#F7F5EE;
    font-weight:bold;
    font-size:13.5px;
    color:var(--navy1);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  details.section > summary::-webkit-details-marker{ display:none; }
  details.section > summary::after{ content:"+"; font-size:16px; color:var(--navy2); }
  details.section[open] > summary::after{ content:"–"; }
  .section-inner{ padding:14px; }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--navy2); font-weight:bold; margin-bottom:4px;
  }
  .field input[type="text"], .field input[type="date"], .field input[type="tel"], .field textarea{
    width:100%; padding:8px 9px; border:1px solid #D3CDBD; border-radius:4px; font-size:13.5px; font-family:inherit;
  }
  .field textarea{ min-height:56px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .repeat-item{
    border:1px solid #E3DFD2; border-radius:5px; padding:10px; margin-bottom:8px; background:#FCFBF8; position:relative;
  }
  .repeat-item .rm{
    position:absolute; top:6px; right:8px; border:none; background:none; color:#b34545; font-size:12px; cursor:pointer;
  }
  .add-btn{ background:var(--navy2); color:#fff; border:none; padding:8px 12px; border-radius:4px; font-size:12.5px; cursor:pointer; }
  .add-btn.sub{ background:#fff; color:var(--navy2); border:1px solid var(--navy2); }
  .checkline{ display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:6px; }
  .hazard-row{ border-top:1px dashed #ddd7c6; padding-top:8px; margin-top:8px; }
  select{ width:100%; padding:8px 9px; border:1px solid #D3CDBD; border-radius:4px; font-size:13.5px; background:#fff; }
  .rr-preview{ font-size:12px; font-weight:bold; padding:4px 8px; border-radius:3px; display:inline-block; margin-top:4px; }
  .rr-preview.rr-low{ background:#D5EDD8; color:#1D6B32; }
  .rr-preview.rr-medium{ background:#FCE8B8; color:#8A6100; }
  .rr-preview.rr-high{ background:#F5C6C6; color:#9B1C1C; }
  .preview-panel{ background:#EFECE3; padding:24px 20px 80px; }
  .preview-toolbar{ max-width:900px; margin:0 auto 14px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ border:none; padding:11px 16px; border-radius:4px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn-gold{ background:var(--gold); color:var(--navy1); }
  .btn-navy{ background:var(--navy1); color:#fff; }
  .btn-outline{ background:#fff; color:var(--navy1); border:1px solid var(--navy1); }
  .share-box{ max-width:900px; margin:0 auto 18px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px 16px; display:none; }
  .share-box.show{ display:block; }
  .share-box label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--navy2); font-weight:bold; display:block; margin-bottom:5px; }
  .share-row{ display:flex; gap:8px; }
  .share-row input{ flex:1; padding:9px; border:1px solid var(--line); border-radius:4px; font-size:12.5px; font-family: ui-monospace, monospace; }
  .doc-wrap{ max-width:900px; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,0.12); }
  .hint{ font-size:11px; color:#8a8577; margin-top:4px; }
  .coshh-picker{ display:flex; gap:6px; margin-bottom:8px; }
  .coshh-picker select{ flex:1; }
  .coshh-chip{
    display:inline-flex; align-items:center; gap:6px; background:#F1EDE3; border:1px solid var(--line);
    border-radius:3px; padding:5px 9px; font-size:12.5px; margin:0 6px 6px 0;
  }
  .coshh-chip button{ border:none; background:none; color:#b34545; cursor:pointer; font-size:11px; }
  .check-item{ padding:4px 0; }
  .check-item.ok{ color:#1D6B32; }
  .check-item.missing{ color:#9B1C1C; }
  .trigger-card{
    border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:8px; background:#FCFBF8;

  .trigger-card p{ margin:0 0 8px; font-size:13px; }
  .trigger-card .add-btn{ font-size:11.5px; padding:6px 10px; }
  .trigger-card.danger{ border-color:#9B1C1C; background:#FCEDED; }
  .add-btn.danger{ background:#9B1C1C; }
  .sig-canvas{
    width:100%; height:130px; background:#fff; border:1px solid var(--line);
    border-radius:3px; touch-action:none; display:block; margin-top:6px;
  }
  .sig-label-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; }
  .sig-clear{ font-size:11px; color:var(--navy2); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }
  .preset-row{ display:flex; gap:6px; margin-bottom:5px; }
  .preset-row select{ flex:1; font-size:12.5px; padding:6px 7px; }
  .preset-row button{

    border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  @media print{
    .form-panel, .topbar, .preview-toolbar, .share-box{ display:none !important; }
    .preview-panel{ padding:0; background:#fff; }
    .doc-wrap{ box-shadow:none; }
  }
</style>

document.getElementById("topLogo").src = LOGO_WHITE_DATA_URI;

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateUK(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function addYearsISO(iso, years){ if(!iso) return ""; const d = new Date(iso); d.setFullYear(d.getFullYear()+years); return d.toISOString().slice(0,10); }
function rrBandOf(score){ if(score>=15) return {label:"High",cls:"rr-high"}; if(score>=6) return {label:"Medium",cls:"rr-medium"}; return {label:"Low",cls:"rr-low"}; }
function newHazard(){ return {hazard:"", whoAtRisk:"Operatives", controls:"", likelihood:2, severity:2}; }
function newRiskTask(){
  const rd = defaultReviewDates();
  return { task:"", personAtRisk:"Operatives", reviewDate:rd.reviewDate, nextReview:rd.nextReview, hazards:[newHazard()] };
}
function defaultReviewDates(){
  const iso = STATE.meta.dateOfIssue || todayISO();
  return { reviewDate: fmtDateUK(iso), nextReview: fmtDateUK(addYearsISO(iso,1)) };
}

// ---------------------------------------------------------------
// Generic repeatable string-list field
// ---------------------------------------------------------------
function renderStringList(containerId, arrKey, placeholder, getArr, onChange){
  const el = document.getElementById(containerId);
  const arr = getArr ? getArr() : STATE[arrKey];
  el.innerHTML = "";
  arr.forEach((val, i) => {
    const row = document.createElement("div");
    row.style.display = "flex"; row.style.gap = "6px"; row.style.marginBottom = "6px";
    row.innerHTML = `
      <input type="text" value="${(val||"").replace(/"/g,'&quot;')}" placeholder="${placeholder}" style="flex:1; padding:8px; border:1px solid #D3CDBD; border-radius:4px; font-size:13.5px;">
      <button type="button" class="add-btn sub" style="padding:6px 10px;">✕</button>
    `;
    const input = row.querySelector("input");
    input.addEventListener("input", () => { arr[i] = input.value; renderPreview(); });
    row.querySelector("button").addEventListener("click", () => {
      arr.splice(i,1);
      if (!arr.length) arr.push("");
      renderStringList(containerId, arrKey, placeholder, getArr, onChange);
      renderPreview();
    });
    el.appendChild(row);
  });
}
function addStringListItem(containerId, arrKey, placeholder, getArr){
  const arr = getArr ? getArr() : STATE[arrKey];
  arr.push("");
  renderStringList(containerId, arrKey, placeholder, getArr);
}

// ---------------------------------------------------------------
// Preset pickers — inject a "pick a common option" dropdown above
// each free-text field that has pre-written options in
// FIELD_OPTIONS. Selecting one fills the textarea; it stays a
// normal editable field afterwards (custom entry always available).
// ---------------------------------------------------------------
const FIELD_PRESET_MAP = {
  "f-manualHandling": "manualHandling",
  "f-hav": "handArmVibration",
  "f-noise": "noise",
  "f-radiation": "radiation",
  "f-access": "accessEgress",
  "f-waheight-p": "workAtHeightPersons",
  "f-waheight-f": "workAtHeightFalling",
  "f-wasteRemoval": "wasteRemoval",
  "f-housekeeping": "housekeeping",
  "f-leaksSpills": "leaksSpills",
  "f-securityArrangements": "securityArrangements",
  "f-pedestrianTraffic": "pedestrianTraffic",
  "f-fireSafety": "fireSafety",
  "f-taskLighting": "taskLighting",
  "f-communication": "communication",
  "f-environmental": "environmental",
  "f-hsMonitoring": "hsMonitoring",
  "f-occupationalHealth": "occupationalHealth",
  "f-dustRespiratory": "dustRespiratory",
  "f-quality": "quality",
  "f-emArrangements": "emergencyArrangements",
  "f-emRescue": "rescuePlan"
};

function injectPresetPickers(){
  Object.keys(FIELD_PRESET_MAP).forEach(fieldId => {
    const textarea = document.getElementById(fieldId);
    const options = FIELD_OPTIONS[FIELD_PRESET_MAP[fieldId]];
    if (!textarea || !options || !options.length) return;

    const row = document.createElement("div");
    row.className = "preset-row";
    const select = document.createElement("select");
    select.innerHTML = `<option value="">Pick a common option…</option>` +
      options.map((o,i) => `<option value="${i}">${o.label.replace(/</g,"&lt;")}</option>`).join("");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Insert";
    btn.addEventListener("click", () => {
      const idx = select.value;
      if (idx === "") return;
      textarea.value = options[idx].text;
      textarea.dispatchEvent(new Event("input", { bubbles: true }));
    });
    row.appendChild(select);
    row.appendChild(btn);
    textarea.parentNode.insertBefore(row, textarea);
  });
}
injectPresetPickers();

// ---------------------------------------------------------------
// AI draft helper — calls the Netlify function, shared by
// Method Statement and Risk Assessment "Draft with AI" buttons.
// Draft is added to the list exactly like a library item; nothing
// is auto signed-off, it's editable text like everything else.
// ---------------------------------------------------------------
function stepladdersBannedForProject(){
  return STATE.stepladderBanned && STATE.stepladderBanned.flagged;
}
async function requestAiDraft(type, taskDescription, statusEl){
  statusEl.textContent = "Drafting…";
  statusEl.style.color = "";
  try{
    const res = await fetch("/.netlify/functions/draft-rams", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        type,
        taskDescription,
        projectName: STATE.meta.projectName || "",
        stepladdersBanned: stepladdersBannedForProject()
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    statusEl.textContent = "Draft added below — review and edit before sign-off.";
    return data.draft;
  } catch(e){
    statusEl.textContent = "AI draft failed: " + e.message;
    statusEl.style.color = "#9B1C1C";
    return null;
  }
}
document.getElementById("msAiDraftBtn").addEventListener("click", async () => {
  const input = document.getElementById("msAiInput");
  const statusEl = document.getElementById("msAiStatus");
  const desc = input.value.trim();
  if (!desc) { statusEl.textContent = "Describe the task first."; statusEl.style.color = "#9B1C1C"; return; }
  const btn = document.getElementById("msAiDraftBtn");
  btn.disabled = true;
  const draft = await requestAiDraft("method-statement", desc, statusEl);
  btn.disabled = false;
  if (!draft) return;
  STATE.methodStatements.push({ title: draft.title, scope: draft.scope, steps: [...(draft.steps||[])], safety: [...(draft.safety||[])] });
  input.value = "";
  renderMethodStatementsForm();
  renderPreview();
});

function likSevOptions(selected){
  return [1,2,3,4,5].map(n => `<option value="${n}" ${Number(selected)===n?"selected":""}>${n}</option>`).join("");
}
function renderHazards(taskIndex, container){
  const hazards = STATE.riskRegister[taskIndex].hazards;
  container.innerHTML = "";
  hazards.forEach((hz,j) => {
    const row = document.createElement("div");
    row.className = "hazard-row";
    const score = (Number(hz.likelihood)||1) * (Number(hz.severity)||1);
    const band = rrBandOf(score);
    row.innerHTML = `
      <div class="field"><label>Hazard</label><input type="text" value="${hz.hazard}" data-k="hazard"></div>
      <div class="field"><label>Who Might Be Harmed</label><input type="text" value="${hz.whoAtRisk}" data-k="whoAtRisk"></div>

        <div class="field"><label>Severity (1-5)</label><select data-k="severity">${likSevOptions(hz.severity)}</select></div>
      </div>
      <div class="rr-preview ${band.cls}" data-role="rr-preview">Risk Rating: ${score} (${band.label})</div>
      <div class="field" style="margin-top:8px;"><label>Existing Controls</label><textarea data-k="controls">${hz.controls||""}</textarea></div>
      <button type="button" class="add-btn sub rm-hazard" style="margin-bottom:4px;">Remove hazard</button>
    `;
    row.querySelectorAll("[data-k]").forEach(inp => {
      const evt = inp.tagName === "SELECT" ? "change" : "input";
      inp.addEventListener(evt, () => {
        hazards[j][inp.dataset.k] = inp.value;
        const s = (Number(hazards[j].likelihood)||1) * (Number(hazards[j].severity)||1);

        preview.className = `rr-preview ${b.cls}`;

    });
    row.querySelector(".rm-hazard").addEventListener("click", () => { hazards.splice(j,1); renderHazards(taskIndex, container); renderPreview(); });
    container.appendChild(row);
  });
}

function fillIfPresent(obj, key, val){
  if (val !== undefined && val !== null && String(val).trim() !== "") obj[key] = val;
}
function applyBriefDraft(d){
  if (!d) return;
  fillIfPresent(STATE.meta, "docTitle", d.docTitle);
  fillIfPresent(STATE.meta, "projectName", d.projectName);

const prepCanvas = document.getElementById("preparerSigCanvas");
const prepCtx = prepCanvas.getContext("2d");
let prepHasSig = false, prepDrawing = false;
function resizePrepCanvas(){
  const rect = prepCanvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  prepCanvas.width = rect.width * ratio;
  prepCanvas.height = rect.height * ratio;
  prepCtx.scale(ratio, ratio);
  prepCtx.lineWidth = 2;
  prepCtx.lineCap = "round";
  prepCtx.strokeStyle = "#1B2A4B";
}
resizePrepCanvas();
function prepPos(e){
  const rect = prepCanvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
prepCanvas.addEventListener("mousedown", e => { prepDrawing = true; prepHasSig = true; const p = prepPos(e); prepCtx.beginPath(); prepCtx.moveTo(p.x,p.y); checkPrepReady(); });
prepCanvas.addEventListener("mousemove", e => { if(!prepDrawing) return; const p = prepPos(e); prepCtx.lineTo(p.x,p.y); prepCtx.stroke(); });
window.addEventListener("mouseup", () => prepDrawing = false);
prepCanvas.addEventListener("touchstart", e => { prepDrawing = true; prepHasSig = true; const p = prepPos(e); prepCtx.beginPath(); prepCtx.moveTo(p.x,p.y); e.preventDefault(); checkPrepReady(); }, {passive:false});
prepCanvas.addEventListener("touchmove", e => { if(!prepDrawing) return; const p = prepPos(e); prepCtx.lineTo(p.x,p.y); prepCtx.stroke(); e.preventDefault(); }, {passive:false});
prepCanvas.addEventListener("touchend", () => prepDrawing = false);
document.getElementById("preparerSigClear").addEventListener("click", () => {
  prepCtx.clearRect(0,0,prepCanvas.width,prepCanvas.height);

});

// Mutates the existing STATE object in place (rather than replacing it)
// so fields bound by direct object reference (meta/schedule/emergency)
// keep working after import — see syncFormFromState/bind() above.
function applyImportedState(data){
  if (!data || typeof data !== "object") throw new Error("Invalid draft file.");
  Object.assign(STATE.meta, data.meta || {});
  Object.assign(STATE.schedule, data.schedule || {});
  Object.assign(STATE.emergency, data.emergency || {});
  Object.keys(STATE).forEach((k) => {
    if (["meta", "schedule", "emergency"].includes(k)) return;
    if (data[k] !== undefined) STATE[k] = data[k];
  });
}

function allScopeText(){

    STATE.meta.docTitle,

function addComplianceNote(text){
  if (!STATE.complianceNotes.includes(text)) STATE.complianceNotes.push(text);
  renderPreview();
  renderTriggers();
}

function renderTriggers(){
  const text = allScopeText();
  const el = document.getElementById("triggersList");
  const cards = [];

  if (/strip[\s-]?out|demolition/.test(text)) {
    cards.push({
      title: "Strip-out / Demolition detected",
      body: `Current standard requires: mandatory eye protection (BS EN ISO 16321), and consideration of health hazards — ${STRIP_OUT_HEALTH_HAZARDS.join(", ")}.`,
      action: () => {
        if (!STATE.ppe.taskSpecific.includes("Eye protection (mandatory for ALL strip-out activities) — BS EN ISO 16321")) {
          STATE.ppe.taskSpecific = STATE.ppe.taskSpecific.filter(x=>x&&x.trim());
          STATE.ppe.taskSpecific.push("Eye protection (mandatory for ALL strip-out activities) — BS EN ISO 16321");
        }
        if (!STATE.dustRespiratory || !STATE.dustRespiratory.trim()) {
          STATE.dustRespiratory = FIELD_OPTIONS.dustRespiratory[2].text; // "Significant dust — strip-out/demolition"
        }
        addComplianceNote(`Strip-out/demolition health hazards considered: ${STRIP_OUT_HEALTH_HAZARDS.join(", ")}.`);
        syncFormFromState();
      }
    });
  }
  if (/hot work|welding|brazing|soldering/.test(text) || (STATE.permits.some(p => p.item === "Hot Works" && p.value && p.value.toLowerCase().includes("yes")))) {
    cards.push({
      title: "Hot Works detected",
      body: HOT_WORKS_REQUIREMENTS.join(" "),
      action: () => {
        addComplianceNote("Hot Works controls: " + HOT_WORKS_REQUIREMENTS.join(" "));
        const hw = STATE.permits.find(p => p.item === "Hot Works");
        if (hw) hw.value = "Yes — PermitPLUS, 2hr fire watch, thermal imaging camera (medium/high risk)";
        syncFormFromState();
      }
    });
  }
  if (/temporary works?|temp works/.test(text)) {
    cards.push({
      title: "Temporary Works detected — Tier 2 review likely required",
      body: "RAMS containing Temporary Works elements should receive a second, independent technical review before works commence.",
      action: () => {
        STATE.tier2.required = true;
        STATE.tier2.reason = "Contains Temporary Works elements.";
        renderPreview();
        renderTriggers();
      }
    });
  }
  if (/electrical|live working/.test(text)) {
    cards.push({
      title: "Electrical Works detected — Tier 2 review likely required",
      body: "RAMS containing Electrical elements should receive a second, independent technical review. Live working should only proceed with exceptional, documented approval.",
      action: () => {
        STATE.tier2.required = true;
        STATE.tier2.reason = "Contains Electrical Works elements.";
        renderPreview();
        renderTriggers();
      }
    });
  }
  if (/lifting|crane|hoist/.test(text)) {
    cards.push({
      title: "Lifting Operations detected — Tier 2 review likely required",
      body: "RAMS containing lifting operations require a Tier 2 review and a lifting plan approved by an Appointed Person.",
      action: () => {
        STATE.tier2.required = true;
        STATE.tier2.reason = "Contains Lifting Operations.";
        renderPreview();
        renderTriggers();
      }
    });
  }
  if (/excavat|dig(ging)?/.test(text)) {
    cards.push({
      title: "Excavation detected",
      body: EXCAVATION_CHECKLIST.join(" "),
      action: () => {
        addComplianceNote("Excavation checklist: " + EXCAVATION_CHECKLIST.join(" "));
      }
    });
  }
  const plantText = STATE.plantEquipment.join(" ").toLowerCase() + " " + STATE.permits.map(p=>p.item+" "+p.value).join(" ").toLowerCase();
  if (/stepladder|step ladder|hop.?up/.test(text + " " + plantText)) {
    cards.push({
      title: "⚠ Stepladders detected — confirm current site policy",
      body: "Many main contractors now ban stepladders outright, including as a last resort. Confirm current policy before relying on this access method — use podium/platform enclosing steps, a mobile tower, or a MEWP where they're prohibited.",
      danger: true,
      action: () => {
        STATE.stepladderBanned = { flagged: true };
        addComplianceNote("Stepladder use to be confirmed against the main contractor's current work-at-height policy before approval — many sites now ban them outright.");
        renderPreview();
        renderTriggers();
      }
    });
  }

  if (!cards.length) {
    el.innerHTML = `<p class="hint" style="margin:0;">No trigger keywords detected in scope/methodology (strip-out, hot works, temporary works, electrical, lifting, excavation).</p>`;
    return;
  }
  el.innerHTML = "";
  cards.forEach(c => {
    const div = document.createElement("div");
    div.className = "trigger-card" + (c.danger ? " danger" : "");
    div.innerHTML = `<b>${c.title}</b><p>${c.body}</p><button type="button" class="add-btn${c.danger?' danger':''}">Apply to RAMS</button>`;
    div.querySelector("button").addEventListener("click", c.action);
    el.appendChild(div);
  });
}

document.getElementById("complianceBtn").addEventListener("click", () => {
  const box = document.getElementById("complianceBox");
  box.classList.toggle("show");
  if (box.classList.contains("show")) {
    renderCompleteness();
    renderTriggers();
  }
});
